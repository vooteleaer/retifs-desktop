[package]
name = "retifs-desktop-jni"
description = "retifs-desktop for Android: the shared core to Kotlin, through JNI, as JSON"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "retifs_desktop"
crate-type = ["cdylib"]

[dependencies]
retifs-desktop-core = { path = "../../core" }
jni = { version = "0.21", default-features = false }
