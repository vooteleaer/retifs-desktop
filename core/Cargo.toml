[package]
name = "retifs-desktop-core"
description = "What every retifs-desktop front end shares: talking to retifsd through libretifs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libretifs = { path = "../../retifs/crates/libretifs" }
# Libraries as files (Android's DocumentsProvider): the FUSE mount's tree.
retifs-tree = { path = "../../retifs/crates/retifs-tree" }
# Fingerprint words, to tell members apart (ADR-0020).
retifs-core = { path = "../../retifs/crates/retifs-core" }
tokio = { version = "1", features = ["rt"] }
# prnsd status --json
serde_json = "1"
# The disk the store is on: the defaults the settings show
fs4 = "0.13"
