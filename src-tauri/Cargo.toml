[package]
name = "retifs-desktop"
version = "0.0.1"
description = "Desktop management utility for retifs (tray and window, on libretifs)"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["time"] }
libretifs = { path = "../../retifs/crates/libretifs" }
