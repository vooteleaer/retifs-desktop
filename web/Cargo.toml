[package]
name = "retifs-web"
description = "retifs' web UI, for nodes without a screen (a NAS, a container): one node's libraries, Announces and reports (retifs ADR-0037)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "retifs-web"
path = "src/main.rs"

[dependencies]
retifs-desktop-core = { path = "../core" }
serde_json = "1"
tiny_http = "0.12"
getrandom = "0.3"
sha2 = "0.10"
